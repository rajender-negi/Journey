name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# read-only token; actions pinned to full commit SHAs (supply-chain hardening)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test (core, agent incl. LangGraph wiring, server)
        run: npm test

      - name: Build UI, demo page and in-browser agent
        run: npm run build

      - name: Check the in-browser agent bundle exists
        run: test -s apps/web/dist-demo/agent.js && ls -l apps/web/dist-demo

      - name: Upload demo page and agent bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-journey-demo
          path: apps/web/dist-demo/
          retention-days: 14
