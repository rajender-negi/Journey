e approval record"],"refs":[7,0]},"FX-COMPILE":{"t":"Code merged to main does not compile","s":"medium","p":"coding","sum":"A change reached main without passing the build. Branch protection is not enforcing the build check.","now":["Revert or forward-fix on main immediately; main must stay releasable"],"prev":["Make build and type check required status checks on main","Run tsc --noEmit (or the language equivalent) in a pre-push hook","Keep changes small so review catches type breaks"],"refs":[8,9,10]},"FX-CONFIG-MISSING":{"t":"Required configuration missing at startup","s":"high","p":"architecture","sum":"The container exits at boot because an environment variable, ConfigMap or Secret is absent in this environment.","now":["Compare env between the failing and last good ReplicaSet: kubectl diff / Argo CD app diff","Add the missing key to the environment overlay and resync"],"prev":["Validate required config in CI with a schema check against each environment overlay","Source secrets through External Secrets Operator so every environment is declared in Git","Fail fast with a clear message listing all missing keys, not the first one"],"refs":[11,12,13]},"FX-REGRESSION-SLOW":{"t":"Release introduced a latency regression","s":"high","p":"system-design","sum":"Dynatrace opened a slowdown problem within an hour of this deployment on the same service.","now":["Roll back to the previous version in Argo CD","Compare service flow and DB calls per request between versions in Dynatrace"],"prev":["Add a Site Reliability Guardian check on p95 and DB calls per request as a post-deploy gate","Canary with automated analysis against Dynatrace metrics","Load test changed endpoints in staging with production traffic shape"],"refs":[0,2,14]},"FX-NON-CHANGE":{"t":"Problem not caused by a deployment","s":"medium","p":"tool-integration","sum":"No deployment finished within 60 minutes before this problem. Treat as an operational incident, not a change failure; it is excluded from change failure rate.","now":["Open the run logs from the link and capture the first error line"],"prev":["Add a rule to FAILURE_RULES for this signature so it is classified next time"],"refs":[14]},"FX-DB-MIGRATION":{"t":"Schema migration failed during sync","s":"critical","p":"design-patterns","sum":"A PreSync migration hook failed, usually because the migration is not idempotent or ran twice.","now":["Inspect the hook Job logs, fix migration state (schema history table) manually if partially applied","Re-run sync only after the migration is idempotent"],"prev":["Use expand and contract: additive migrations first, code switch second, destructive cleanup last","Make migrations idempotent (IF NOT EXISTS) and run them against a prod snapshot in staging","Order with Argo CD sync waves: migration hook before workload"],"refs":[15,16,17,18]},"FX-FLAKY-TEST":{"t":"Test failure caused by timing, not by the change","s":"medium","p":"coding","sum":"The test has a history of passing on retry. It blocks delivery without signalling a real defect.","now":["Re-run failed jobs only","Open a ticket against the owning team with the test name"],"prev":["Quarantine tests that fail and pass on the same SHA; track a flake rate per suite","Replace real timers and network with fakes in unit tests","Make the required status check a stable suite, not the quarantined set"],"refs":[19,20]},"FX-IMAGE-PULL":{"t":"Image tag missing or registry auth failed","s":"high","p":"tool-integration","sum":"The manifest references an image tag that does not exist in the registry, or the node cannot authenticate to it.","now":["Confirm the tag exists: aws ecr describe-images --image-ids imageTag=\u003ctag>","Re-run the image publish job for this SHA, then resync the Argo CD app","If auth: check the node IAM role or imagePullSecrets on the service account"],"prev":["Deploy by immutable digest (image@sha256) written by CI, never by mutable tag","Enable ECR tag immutability","Gate the Argo CD sync on the image-publish jo se ImagePullBackOff when tags move.","refs":[21,22]},"K8S-NO-SECCTX":{"t":"No securityContext with runAsNonRoot","s":"medium","p":"security","rec":"Apply the Restricted Pod Security Standard: runAsNonRoot, drop all capabilities, readOnlyRootFilesystem where possible.","refs":[25]},"CODE-HTTP-NO-TIMEOUT":{"t":"Outbound HTTP call without timeout","s":"high","p":"system-design","rec":"Set an explicit timeout on every outbound call (shorter than the caller timeout), retry only idempotent calls with backoff and jitter.","refs":[27,28]},"CODE-SQL-CONCAT":{"t":"SQL built by string concatenation","s":"critical","p":"security","rec":"Use parameterized queries or the ORM query builder. Never concatenate request values into SQL.","refs":[29]},"REPO-NO-CODEOWNERS":{"t":"No CODEOWNERS file","s":"low","p":"tool-integration","rec":"Add CODEOWNERS so reviews route to the owning team automatically and ownership matches the CMDB.","refs":[30]},"REPO-NO-DEPENDABOT":{"t":"No automated dependency updates","s":"medium","p":"security","rec":"Enable Dependabot version updates for each ecosystem (language, docker, github-actions) so CVE fixes arrive before they block a release.","refs":[6]},"ARCH-NO-CIRCUIT-BREAKER":{"t":"Remote calls without retry or circuit breaker","s":"medium","p":"design-patterns","rec":"Wrap downstream calls with a circuit breaker and bounded retries so one slow dependency cannot exhaust threads or connections.","refs":[31,28]},"K8S-NO-PDB":{"t":"No PodDisruptionBudget","s":"low","p":"architecture","rec":"Add a PDB so node drains and cluster upgrades keep enough replicas serving.","refs":[32]},"K8S-NO-LIMITS":{"t":"No resource requests or limits","s":"medium","p":"system-design","rec":"Set CPU and memory requests from observed p95 usage and a memory limit with headroom. This drives both scheduling stability and cost allocation.","refs":[4]},"CODE-N-PLUS-ONE":{"t":"Query executed inside a loop (N+1)","s":"high","p":"design-patterns","rec":"Fetch related rows in one query (JOIN, IN clause, or JPA entity graph / batch fetch) instead of one query per item.","refs":[33]},"TF-S3-PUBLIC-ACCESS":{"t":"S3 bucket without public access block","s":"high","p":"security","rec":"Add aws_s3_bucket_public_access_block with all four settings true, and enforce account-level block public access.","refs":[34]},"TF-NO-REMOTE-STATE":{"t":"Terraform without remote state backend","s":"medium","p":"tool-integration","rec":"Configure a remote backend with locking (S3 with native lockfile, or Terraform Cloud) so applies from CI and laptops do not diverge.","refs":[35]},"CODE-HARDCODED-SECRET":{"t":"Credential committed to source","s":"critical","p":"security","rec":"Rotate the credential now, remove it from history, and load it from a secrets manager through External Secrets. Use IRSA or workload identity instead of static keys.","refs":[36,12]},"CODE-JWT-ALG-NONE":{"t":"JWT \"none\" algorithm accepted","s":"critical","p":"security","rec":"Allow-list a single expected algorithm (RS256 or ES256) and reject unsigned tokens.","refs":[37]},"K8S-SINGLE-REPLICA":{"t":"Single replica, no redundancy","s":"medium","p":"architecture","rec":"Run at least 2 replicas spread across zones with a PodDisruptionBudget, or an HPA with minReplicas 2.","refs":[32]},"ARCH-CACHE-ASIDE":{"t":"Read-heavy repeated queries with no cache: add Redis cache-aside","s":"high","p":"architecture","rec":"Introduce cache-aside with Redis for the repeated reads (TTL plus invalidate on write). Use a managed Redis (ElastiCache / Azure Cache for Redis). Expected effect: DB calls per request and p95 drop, and the database instance can be downsized. Validate with a Dynatrace before/after on DB calls per request.","refs":[38,39]},"RUNTIME-CHATTY-DB":{"t":"Chatty database access confirmed in production","s":"high","p":"design-patterns","rec":"Batch or join the per-item queries; target under 5 DB calls per request for list endpoints.","refs":[33]}},"scores":{"BA0001":{"o":68,"g":"C","p":[["coding",81
